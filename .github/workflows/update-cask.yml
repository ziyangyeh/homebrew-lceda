name: Update cask

on:
  schedule:
    # 02:20 Asia/Shanghai, daily
    - cron: "20 18 * * *"
  workflow_dispatch:
    inputs:
      full-download:
        description: "Hash the installer locally instead of trusting the CDN header"
        type: boolean
        default: false
      force:
        description: "Rewrite version and checksum even if nothing changed upstream"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-cask
  cancel-in-progress: false

jobs:
  update:
    # macOS so the new cask can be audited *before* it is pushed: a broken
    # update fails the job instead of landing on main and breaking installs.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAP: ziyangyeh/lceda
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          path: homebrew-lceda

      - name: Link the checkout in as a tap
        run: |
          dest="$(brew --repository)/Library/Taps/ziyangyeh/homebrew-lceda"
          mkdir -p "$(dirname "$dest")"
          ln -s "$GITHUB_WORKSPACE/homebrew-lceda" "$dest"
          brew trust --tap "$TAP"

      - name: Check upstream and refresh the cask
        id: update
        working-directory: homebrew-lceda
        run: |
          args=()
          if [ "${{ inputs.full-download }}" != "true" ]; then
            # brew fetch below downloads the installer anyway and verifies the
            # checksum against the cask, so the header is enough here.
            args+=(--trust-header)
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            args+=(--force)
          fi
          python3 scripts/update_cask.py "${args[@]}"

      - name: brew style
        if: steps.update.outputs.updated == 'true'
        run: brew style "$TAP"

      - name: brew fetch
        if: steps.update.outputs.updated == 'true'
        # Downloads the installer and verifies it against the sha256 just written.
        run: brew fetch --cask "$TAP/lceda-pro"

      - name: brew audit
        if: steps.update.outputs.updated == 'true'
        run: brew audit --cask --online --strict "$TAP/lceda-pro"

      - name: Commit and push
        if: steps.update.outputs.updated == 'true'
        working-directory: homebrew-lceda
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/lceda-pro.rb
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "lceda-pro ${{ steps.update.outputs.version }}" \
            -m "Automatic update from ${{ steps.update.outputs.old_version }}."
          git push

      - name: Summary
        run: |
          {
            echo "| | |"
            echo "|---|---|"
            echo "| previous | \`${{ steps.update.outputs.old_version }}\` |"
            echo "| upstream | \`${{ steps.update.outputs.version }}\` |"
            echo "| published | \`${{ steps.update.outputs.updated }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
