name: CI

on:
  push:
    branches: [main]
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "Casks/**"
      - "Formula/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      install:
        description: "Also install and uninstall for real (downloads ~350 MB per platform)"
        type: boolean
        default: false

jobs:
  audit:
    # The cask covers macOS/arm64 and the formula covers Linux/x86_64, so each
    # one can only be audited on the platform it targets.
    name: ${{ matrix.kind }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: cask
            os: macos-latest
          - kind: formula
            os: ubuntu-latest
    env:
      TAP: ziyangyeh/lceda
      HOMEBREW_NO_INSTALL_FROM_API: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          path: homebrew-lceda

      - name: Put Homebrew on PATH
        # The Ubuntu runner ships Homebrew but does not always export it.
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi

      - name: Link the checkout in as a tap
        run: |
          dest="$(brew --repository)/Library/Taps/ziyangyeh/homebrew-lceda"
          mkdir -p "$(dirname "$dest")"
          ln -s "$GITHUB_WORKSPACE/homebrew-lceda" "$dest"
          brew tap-info "$TAP"
          brew trust --tap "$TAP"

      - name: brew style
        run: brew style "$TAP"

      - name: brew audit
        run: brew audit --${{ matrix.kind }} --online --strict "$TAP/lceda-pro"

      - name: Install smoke test
        if: inputs.install
        run: |
          brew install --${{ matrix.kind }} "$TAP/lceda-pro"
          # `brew test` is formula-only; the cask has no equivalent.
          if [ "${{ matrix.kind }}" = "formula" ]; then
            brew test "$TAP/lceda-pro"
          fi
          brew uninstall --${{ matrix.kind }} "$TAP/lceda-pro"
